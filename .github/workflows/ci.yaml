name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Full build with attestations and release for tags
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint, unit test, build, and validate artifact
        run: npm run check

      - name: Install browser
        run: npm exec -- playwright install --with-deps chromium

      - name: Test downloaded HTML offline
        run: npm run test:browser

      - name: Create versioned copy for release
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cp ./dist/index.html ./dist/symmetro-${VERSION}.html

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: './dist/symmetro-*.html'

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/symmetro-*.html
          draft: true

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
