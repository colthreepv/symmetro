name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-build:
    name: Lint, test, and offline build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Lint, unit test, build, and validate artifact
        run: npm run check

      - name: Install browser
        run: npm exec -- playwright install --with-deps chromium

      - name: Test downloaded HTML offline
        run: npm run test:browser

      - name: Upload verified standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: symmetro-standalone-html
          path: dist/index.html
          if-no-files-found: error

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symmetro-ui-screenshots
          path: test-results/screenshots/*.png
          if-no-files-found: ignore
